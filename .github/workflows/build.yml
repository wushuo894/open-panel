name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/checkout@v4
      - name: Get version
        run: |
          mvn -B -ntp -DskipTests package
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=v$version" >> $GITHUB_ENV
      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          tag_name: ${{ env.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: open-panel-application/target/open-panel.jar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/wushuo894/open-panel:latest
            ghcr.io/wushuo894/open-panel:${{ env.version }}
